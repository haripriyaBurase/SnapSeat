
services:

  db:
    image: postgres:16
    container_name: snapseat-db
    environment:
      POSTGRES_DB: snapseat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Hari
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d snapseat"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: snapseat-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/snapseat
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Hari
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
          VITE_API_BASE_URL: /
          VITE_WS_URL: ws://localhost:5173/ws
    container_name: snapseat-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
